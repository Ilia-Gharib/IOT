name: ava_mobile
description: "AVA 8 - Smart Building Voice Assistant Mobile Client"
publish_to: 'none'
version: 1.0.8+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0
  record: ^5.1.2
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  speech_to_text: ^7.5.0
  connectivity_plus: 6.1.0
  flutter_foreground_task: ^11.0.3
  sherpa_onnx: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_platform_interface: 1.1.0
  shared_preferences_android: 2.3.4
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true
  assets:
    - assets/kws/
